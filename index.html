</head>

  <!-- pinceladas de fundo da mesa -->
  <div class="mesa-fundo" aria-hidden="true"><span class="pincel-fundo p1"></span><span class="pincel-fundo p2"></span></div>

  <!-- carta de área da Administração (início, resultado) -->
  <template id="tpl-area">
    <article class="carta carta-area">
      <div class="ca-topo"><b class="ca-num"></b><span class="ca-rotulo"></span></div>
      <div class="ca-arte"><span class="ca-naipe"><svg aria-hidden="true"><use href="#a-planejamento"/></svg></span></div>
      <p class="ca-placa"><span class="ca-nome"></span></p>
      <p class="ca-rodape">ADM Experience · EEB Eurico Pinz</p>
    </article>
  </template>

  <!-- crachá do jogador (nome e final) -->
  <template id="tpl-cracha">
    <article class="cracha">
      <span class="cr-cordao" aria-hidden="true"></span>
      <span class="cr-presilha" aria-hidden="true"></span>
      <img class="cr-logo" src="assets/marca/adm-experience-adesivo.webp" alt="" width="1331" height="533">
      <div class="cr-foto" aria-hidden="true"><span class="cr-iniciais"></span></div>
      <p class="cr-nome"></p>
      <p class="cr-placa"><span class="cr-cargo"></span></p>
      <ul class="cr-selos" aria-hidden="true"></ul>
      <p class="cr-acertos"></p>
      <p class="cr-rodape">ADM Experience · EEB Eurico Pinz</p>
    </article>
  </template>

  <header class="barra">
    <img class="barra-logo" src="assets/marca/adm-experience-adesivo.webp" alt="ADM Experience" width="1331" height="533">
    <ol class="trilha" data-t-label="trilha_label"></ol>
    <div class="barra-direita">
      <button class="icone-botao" id="btn-pausa" type="button" aria-pressed="false"><svg class="pausa-on"><use href="#i-pausa"/></svg><svg class="pausa-off"><use href="#i-play"/></svg></button>
      <button class="icone-botao" id="btn-som" type="button" data-t-label="som_label" aria-pressed="true"><svg class="som-on"><use href="#i-som"/></svg><svg class="som-off"><use href="#i-mudo"/></svg></button>
    </div>
  </header>
  <p class="aviso-pausa" data-t="pausado" role="status"></p>

  <main class="palco">
    <!-- 1. início -->
    <section class="tela" id="inicio">
      <div class="inicio-texto">
        <img class="inicio-logo entra" src="assets/marca/adm-experience-adesivo.webp" alt="ADM Experience" width="1331" height="533">
        <p class="kicker entra" data-t="start_kicker"></p>
        <h1 class="inicio-titulo entra">Topa o <span class="sublinhado">desafio ADM?</span></h1>
        <p class="inicio-sub entra" data-t="start_subtitle"></p>
        <button class="botao botao-grande entra" id="btn-comecar" type="button"><span data-t="start_button"></span><svg><use href="#i-seta"/></svg></button>
      </div>
      <div class="leque" aria-hidden="true"></div>
      <footer class="rodape">
        <span class="rodape-rotulo" data-t="realizacao"></span>
        <img src="assets/marca/curso.webp" alt="Técnico em Administração" width="1458" height="845">
        <img src="assets/marca/escola.webp" alt="EEB Eurico Pinz" width="740" height="759">
      </footer>
    </section>

    <!-- 2. nome no crachá -->
    <section class="tela" id="nome">
      <form class="nome-form entra" id="form-nome">
        <h2 class="titulo-tela" data-t="nome_title"></h2>
        <p data-t="nome_subtitle"></p>
        <label for="campo-nome" data-t="name_label"></label>
        <input id="campo-nome" name="nome" type="text" maxlength="20" autocomplete="off" autocapitalize="words" spellcheck="false">
        <button class="botao" type="submit"><span data-t="begin_button"></span><svg><use href="#i-seta"/></svg></button>
      </form>
      <div class="nome-previa entra" aria-hidden="true"></div>
    </section>

    <!-- 3. a missão (o problema) -->
    <section class="tela" id="missao">
      <article class="carta missao-carta">
        <p class="missao-rotulo"></p>
        <span class="etiqueta"></span>
        <h2 class="missao-titulo" tabindex="-1"></h2>
        <p class="missao-cenario"></p>
        <ul class="pista"></ul>
        <button class="botao missao-seguir" type="button"><span data-t="ver_opcoes"></span><svg><use href="#i-seta"/></svg></button>
        <span class="tempo-barra" aria-hidden="true"></span>
      </article>
    </section>

    <!-- 4. a decisão: três cartas na mão -->
    <section class="tela" id="decisao">
      <div class="decisao-cabeca">
        <span class="etiqueta"></span>
        <p class="decisao-cenario"></p>
        <h2 class="enunciado" tabindex="-1"></h2>
        <ul class="pista"></ul>
      </div>
      <div class="relogio" role="timer" data-t-label="relogio_label">
        <svg aria-hidden="true"><use href="#i-relogio"/></svg>
        <b class="relogio-seg"></b>
        <span class="relogio-pavio" aria-hidden="true"></span>
      </div>
      <div class="mao" role="group" data-t-label="opcoes_label"></div>
    </section>

    <!-- 5. a consequência: a carta escolhida vira -->
    <section class="tela" id="consequencia">
      <article class="carta conseq-carta">
        <h2 class="carimbo" tabindex="-1"></h2>
        <p class="conseq-rotulo" data-t="sua_decisao"></p>
        <p class="conseq-escolha"><b class="conseq-letra" aria-hidden="true"></b><span class="conseq-escolha-texto"></span></p>
        <p class="conseq-rotulo" data-t="aconteceu"></p>
        <p class="conseq-texto"></p>
      </article>
      <p class="melhor"><span class="melhor-rotulo"><svg aria-hidden="true"><use href="#i-check"/></svg><span data-t="melhor_rotulo"></span></span><span class="melhor-texto"></span></p>
      <div class="acoes-etapa">
        <button class="botao" id="btn-conseq" type="button"><span data-t="continuar"></span><svg><use href="#i-seta"/></svg></button>
        <span class="tempo-barra" aria-hidden="true"></span>
      </div>
    </section>

    <!-- 6. o resultado: a área da Administração -->
    <section class="tela" id="resultado">
      <div class="res-carta-area">
        <img class="res-faiscas" src="assets/marca/faiscas.png" alt="" width="145" height="172">
      </div>
      <div class="res-info">
        <p class="kicker res-kicker"></p>
        <h2 class="res-titulo" tabindex="-1"></h2>
        <p class="res-explicacao"></p>
        <div class="res-empresa">
          <p class="res-empresa-rotulo" data-t="na_empresa"></p>
          <p class="res-empresa-texto"></p>
        </div>
        <div class="acoes-etapa">
          <button class="botao" id="btn-resultado" type="button"><span class="btn-resultado-texto"></span><svg><use href="#i-seta"/></svg></button>
          <span class="tempo-barra" aria-hidden="true"></span>
        </div>
      </div>
    </section>

    <!-- 7. final: o crachá -->
    <section class="tela" id="final">
      <div class="final-cracha">
        <img class="final-coroa" src="assets/marca/coroa.png" alt="" width="222" height="154">
      </div>
      <div class="final-info">
        <p class="kicker" data-t="final_kicker"></p>
        <h1 class="final-cargo" tabindex="-1"></h1>
        <p class="final-frase"></p>
        <p class="final-mensagem"></p>
        <section class="colecao">
          <h3 class="colecao-titulo"></h3>
          <ul class="colecao-lista"></ul>
        </section>
        <p class="cta" data-t="cta"></p>
        <p class="aviso" data-t="aviso"></p>
        <div class="acoes">
          <button class="botao botao-claro" id="btn-imprimir" type="button"><svg><use href="#i-imprimir"/></svg><span data-t="print_button"></span></button>
          <button class="botao" id="btn-reiniciar" type="button"><svg><use href="#i-reiniciar"/></svg><span data-t="restart_button"></span></button>
        </div>
      </div>
      <footer class="res-rodape">
        <img src="assets/marca/curso.webp" alt="Técnico em Administração" width="1458" height="845">
        <img src="assets/marca/escola.webp" alt="EEB Eurico Pinz" width="740" height="759">
        <span data-t="credits"></span>
      </footer>
    </section>
  </main>
</body>
</html>
